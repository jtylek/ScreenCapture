name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # Actions tab > Build installers > Run workflow: builds and publishes a release for the version in pyproject.toml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install . pytest
      - run: QT_QPA_PLATFORM=offscreen pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/ScreenCapture-Setup.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source bundle with install.sh
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mkdir -p dist
          tar czf "dist/screencapture-$v-linux.tar.gz" --transform "s,^,screencapture-$v/," \
            install.sh uninstall.sh pyproject.toml README.md screencapture packaging
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "tag=v$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # Creates the tag too when it doesn't exist yet (manual runs), pointing at the built commit.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
