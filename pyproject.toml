[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screencapture"
version = "0.2.0"
description = "Simple screen capture tool for Windows and Linux with annotations and a library of screenshots."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.5",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
screencapture = "screencapture.app:main"

[project.gui-scripts]
screencapture-gui = "screencapture.app:main"

[tool.setuptools]
packages = ["screencapture"]

[tool.setuptools.package-data]
screencapture = ["*.png", "*.svg"]
