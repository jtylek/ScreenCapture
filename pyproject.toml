[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screencapture"
version = "0.1.0"
description = "Small Snagit-like screen capture tool: capture a region or window, annotate, crop, keep a library of recent captures."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.5",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
screencapture = "screencapture.app:main"

[project.gui-scripts]
screencapture-gui = "screencapture.app:main"

[tool.setuptools]
packages = ["screencapture"]

[tool.setuptools.package-data]
screencapture = ["*.png", "*.svg"]
